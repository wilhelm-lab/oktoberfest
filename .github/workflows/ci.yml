name: CI

# Runs on pushes to the main integration branches and on every pull request.
on:
    workflow_dispatch: # Allow manual triggering from the GitHub Actions tab.
    push:
        # release/* trigger is there just in case someone uses a release branch
        # but we opt for a simpler approach to release from development and
        # merge that tagged commit to main instead of creating a separate release branch.
        branches: [main, development, "release/*"]
    pull_request:
        branches:
            - "**"

# ---------------------------------------------------------------------------
# Shared setup used by every job that needs Poetry + the project installed.
# ---------------------------------------------------------------------------

jobs:
    # ------------------------------------------------------------------
    # Lint — ruff check + ruff format (runs once, ubuntu/py3.12 only)
    # ------------------------------------------------------------------
    lint:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install Poetry
              run: pip install poetry

            - name: Validate pyproject.toml
              run: poetry check

            - name: Install dependencies
              run: poetry install --with dev

            - name: Lint with ruff
              run: make lint

    # -----------------------------------------------------------------------
    # 2. Tests — unit tests across all supported Python versions.
    #    Unit coverage report is generated once on Python 3.12 and uploaded.
    #    Integration coverage is uploaded by run_integration_tests.yml.
    # -----------------------------------------------------------------------
    test:
        name: Test (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Poetry
              run: pip install poetry

            - name: Cache Poetry virtualenv
              uses: actions/cache@v5
              with:
                  path: ~/.cache/pypoetry/virtualenvs
                  key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
                  restore-keys: poetry-${{ runner.os }}-py${{ matrix.python-version }}-

            - name: Install project and dependencies
              run: poetry install

            - name: Run unit tests
              if: matrix.python-version != '3.12'
              run: make test

            - name: Run unit tests with coverage
              if: matrix.python-version == '3.12'
              run: make coverage-unit

            - name: Upload coverage
              if: matrix.python-version == '3.12'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  flags: unit-tests
                  name: py3.12-unit
                  verbose: true
                  fail_ci_if_error: false

    # -----------------------------------------------------------------------
    # Python 3.14 is being introduced gradually, so this job does not block
    # merges. poetry.lock stops at 3.13 because upstream dependencies still cap
    # python, so it installs unlocked with uv, which ignores those upper bounds.
    # -----------------------------------------------------------------------
    test-python-3-14:
        name: Test (Python 3.14, experimental)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install project and test dependencies
              run: |
                  pip install uv
                  uv pip install --system . pytest pyteomics openpyxl typeguard dask fast-array-utils

            - name: Run unit tests
              run: python -m pytest tests/unit_tests

    # -----------------------------------------------------------------------
    # 3. Runtime type checking — runs the test suite through typeguard.
    #    Python 3.12 only.
    # -----------------------------------------------------------------------
    typeguard:
        name: Type checking (typeguard)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install Poetry
              run: pip install poetry

            - name: Cache Poetry virtualenv
              uses: actions/cache@v5
              with:
                  path: ~/.cache/pypoetry/virtualenvs
                  key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
                  restore-keys: poetry-${{ runner.os }}-py3.12-

            - name: Install project and dependencies
              run: poetry install

            - name: Run typeguard
              run: make typecheck

    # -----------------------------------------------------------------------
    # 4. Doctest examples — validates inline code examples in all docstrings.
    #    Python 3.12 (latest supported version).
    # -----------------------------------------------------------------------
    xdoctest:
        name: Doctest examples (xdoctest)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install Poetry
              run: pip install poetry

            - name: Cache Poetry virtualenv
              uses: actions/cache@v5
              with:
                  path: ~/.cache/pypoetry/virtualenvs
                  key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
                  restore-keys: poetry-${{ runner.os }}-py3.12-

            - name: Install project and dependencies
              run: poetry install

            - name: Run xdoctest
              run: make doctest
