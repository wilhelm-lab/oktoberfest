name: Integration Tests

# Integration tests are heavier and may depend on external services or
# multiple packages, so we deliberately avoid running them on every push/PR.
#
# Triggers:
#   - Manual dispatch (primary day-to-day trigger, supports input overrides)
#   - Release and patch PRs to main (the release gate: these PRs carry the version bump)
#   - Version bumps on development: pushes that change the version in pyproject.toml
#     (other pushes that touch pyproject.toml, e.g. dependency updates, are skipped by the version job)
#
# Draft releases cannot trigger workflows on GitHub (release events of drafts are not sent to Actions),
# and Release Drafter updates the draft on every push to development anyway.
#
# To run against a specific branch or with extra pytest flags, use the
# manual dispatch inputs below.
on:
    workflow_dispatch:
        inputs:
            python-version:
                description: "Python version(s) to use"
                required: false
                default: "3.12 + 3.13"
                type: choice
                options: ["3.12 + 3.13", "3.11", "3.12", "3.13", "all"]
            pytest-extra-args:
                description: "Extra pytest arguments (e.g. -k test_my_feature)"
                required: false
                default: ""

    pull_request:
        branches: [main]

    push:
        branches: [development]
        paths: [pyproject.toml]

jobs:
    # -----------------------------------------------------------------------
    # On pushes, only run when the version in pyproject.toml changed.
    # -----------------------------------------------------------------------
    version:
        name: Version bump
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.compare.outputs.changed }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 2

            - name: Compare the version with the previous commit
              id: compare
              run: |
                  if [ "${{ github.event_name }}" != "push" ]; then
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  version() { python3 -c "import sys, tomllib; d = tomllib.loads(sys.stdin.read()); print(d.get('project', {}).get('version') or d['tool']['poetry']['version'])"; }
                  git fetch --depth=1 origin "${{ github.event.before }}" || true
                  new=$(version < pyproject.toml)
                  old=$(git show "${{ github.event.before }}:pyproject.toml" 2>/dev/null | version || echo "")
                  echo "version $old -> $new"
                  if [ "$old" != "$new" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

    # -----------------------------------------------------------------------
    # Integration tests — pytest against ./tests/integration_tests.
    # Runs on Python 3.12 and 3.13 in parallel (one runner each, so it takes no
    # longer than one version); manual dispatch can pick one version or all.
    # Uploads integration-only coverage so Codecov can merge it with unit
    # coverage uploaded by the main CI workflow.
    # -----------------------------------------------------------------------
    integration-test:
        name: Integration Tests (Python ${{ matrix.python-version }})
        needs: version
        if: needs.version.outputs.changed == 'true'
        runs-on: ubuntu-latest
        strategy:
            # finish the other versions when one fails
            fail-fast: false
            matrix:
                python-version: ${{ fromJSON(inputs.python-version == 'all' && '["3.11", "3.12", "3.13"]' || contains(fromJSON('["3.11", "3.12", "3.13"]'), inputs.python-version) && format('["{0}"]', inputs.python-version) || '["3.12", "3.13"]') }}
        # the rescoring use case tests (tests/integration_tests/test_rescoring_usecases.py) took about 1.5 h on a
        # 40-core server (cit ~26 min, multifrag ~45 min)
        timeout-minutes: 360

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install Poetry
              run: pip install poetry

            - name: Cache Poetry virtualenv
              uses: actions/cache@v6
              with:
                  path: ~/.cache/pypoetry/virtualenvs
                  # Separate cache key from the unit-test jobs so that adding
                  # integration-only dependencies does not bust their caches.
                  key: poetry-integration-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
                  restore-keys: poetry-integration-${{ runner.os }}-py${{ matrix.python-version }}-

            # inputs of the rescoring use case tests (mzML + MSFragger results from figshare, a few GB);
            # the key changes when the figshare URLs in the test module change
            - name: Cache rescoring use case inputs
              uses: actions/cache@v6
              with:
                  path: tests/data/*/inputs
                  key: usecase-inputs-${{ hashFiles('tests/integration_tests/test_rescoring_usecases.py') }}

            # the rescoring use case tests run percolator (same version as in the Dockerfile)
            - name: Install percolator
              run: |
                  DEB=percolator-v3-06-linux-amd64.deb
                  wget -q https://github.com/percolator/percolator/releases/download/rel-3-06-01/$DEB -O /tmp/$DEB
                  sudo apt-get install -y /tmp/$DEB

            # MS1 quantification test (test_rescoring_quantification): FlashLFQ runs on .NET 8
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "8.0.x"

            - name: Install FlashLFQ
              run: |
                  DIR=tests/data/quant/inputs/flashlfq
                  if [ ! -f $DIR/CMD.dll ]; then
                    mkdir -p $DIR
                    wget -q https://github.com/smith-chem-wisc/FlashLFQ/releases/download/2.1.4/FlashLFQ.zip -O /tmp/FlashLFQ.zip
                    unzip -q /tmp/FlashLFQ.zip -d $DIR
                  fi

            - name: Install project and dependencies
              # If your integration tests require extra packages (e.g. a
              # dedicated [tool.poetry.group.integration] group in
              # pyproject.toml), add --with integration here.
              run: poetry install --with dev --extras quant

            - name: Run integration tests
              env:
                  # Expose any secrets your integration tests need here:
                  # MY_SERVICE_API_KEY: ${{ secrets.MY_SERVICE_API_KEY }}
                  INTEGRATION_TEST: "1" # Sentinel env var tests can assert on
              # run the tests once, with coverage (make coverage-int would run them a second time)
              run: |
                  poetry run coverage erase
                  poetry run coverage run -m pytest tests/integration_tests \
                    -v \
                    --tb=short \
                    ${{ inputs.pytest-extra-args }}

            - name: Generate integration coverage report
              if: always()
              run: |
                  poetry run coverage report -i
                  poetry run coverage xml

            - name: Upload integration coverage
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: coverage.xml
                  flags: integration-tests
                  name: integration-${{ matrix.python-version }}
                  verbose: true
                  fail_ci_if_error: false
